<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ page_title|default:"JobHunter" }} · JobHunter{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
{% load static %}
<link rel="stylesheet" href="{% static 'css/main.css' %}?v=4">
{% block extra_css %}{% endblock %}
</head>
<body data-page="{{ page|default:'' }}">
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
