{% extends "base.html" %}
{% load static %}
{% block body %}
<main class="login-wrap">
  <form class="login-card" id="loginForm" novalidate>
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M16 4 29 27H3z" fill="currentColor"/></svg>
    <h1>JobHunter</h1>
    <p class="quiet">This is a private copy. Sign in to continue.</p>
    <label>Email<input type="email" id="lgEmail" autocomplete="username" required autofocus></label>
    <label>Password<input type="password" id="lgPass" autocomplete="current-password" required></label>
    <button type="submit" class="go" id="lgGo">Sign in</button>
    <p class="login-err" id="lgErr" role="alert"></p>
  </form>
</main>
{% endblock %}
{% block scripts %}
<script>
(function(){
  const next='{{ next|escapejs }}'||'/';   // same-site path only (checked server-side in core.views.login_page)
  const csrf=()=>(document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||'';
  const f=document.getElementById('loginForm'), err=document.getElementById('lgErr'), go=document.getElementById('lgGo');
  f.onsubmit=async e=>{
    e.preventDefault(); err.textContent=''; go.disabled=true; go.textContent='Signing in…';
    try{
      const r=await fetch('/api/auth/login/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':decodeURIComponent(csrf())},
        body:JSON.stringify({email:document.getElementById('lgEmail').value,password:document.getElementById('lgPass').value})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||d.detail||'Could not sign in');
      location.href=next;
    }catch(ex){ err.textContent=ex.message; go.disabled=false; go.textContent='Sign in'; }
  };
})();
</script>
{% endblock %}
