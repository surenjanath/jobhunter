  <div id="live" class="live" hidden>
    <div class="live-head">
      <strong id="liveTitle">Idle</strong>
      <button type="button" id="liveClose">Close</button>
    </div>
    <pre id="console"></pre>
  </div>
  <footer class="dock">
    <div class="cycle">
      <button type="button" id="cyclePrev" aria-label="Previous report">‹</button>
      <span>Cycle reports</span>
      <button type="button" id="cycleNext" aria-label="Next report">›</button>
    </div>
    <div class="dock-actions">
      <button type="button" id="bScan">Scan</button>
      <button type="button" id="bSync">Sync</button>
      <button type="button" id="bLive">Live check</button>
      <button type="button" id="bTests">Tests</button>
      <button type="button" id="logToggle">Log</button>
      <a id="sheetLink" href="#" target="_blank" hidden>Sheet</a>
      <select id="prov" aria-label="Letter provider">
        <option value="auto">auto</option>
        <option value="claude_code">Claude Code</option>
        <option value="ollama">Ollama</option>
        <option value="anthropic">Anthropic API</option>
        <option value="openai">OpenAI</option>
        <option value="gemini">Google Gemini</option>
        <option value="groq">Groq</option>
        <option value="openrouter">OpenRouter</option>
        <option value="mistral">Mistral</option>
        <option value="deepseek">DeepSeek</option>
        <option value="xai">xAI</option>
        <option value="together">Together AI</option>
        <option value="cerebras">Cerebras</option>
        <option value="fireworks">Fireworks AI</option>
        <option value="custom">Custom endpoint</option>
        <option value="template">Template</option>
      </select>
    </div>
    <div class="geom" id="geomMarks" aria-hidden="true">
      <svg data-mark="block" width="14" height="12" viewBox="0 0 14 12"><path d="M7 0 L14 12 H0 Z" fill="currentColor"/></svg>
      <svg data-mark="health" width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      <svg data-mark="sheet" width="12" height="12" viewBox="0 0 12 12"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      <svg data-mark="live" width="14" height="12" viewBox="0 0 14 12"><path d="M7 1 L13 11 H1 Z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
    </div>
  </footer>
